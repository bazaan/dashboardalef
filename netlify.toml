[build]
  command = "nuxt build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # 6 GB para el build. Con 4096 el bundling de Nitro se quedaba sin heap
  # ("Ineffective mark-compacts near heap limit") y el deploy fallaba: el
  # proyecto ya rozaba el techo con ~20 dashboards grandes y cada módulo nuevo
  # lo empujaba un poco más. El contenedor de Netlify tiene 8 GB, así que 6144
  # deja aire para el resto del proceso.
  NODE_OPTIONS = "--max-old-space-size=6144"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/functions-internal/server/chunks/nitro/nitro.mjs"
  # SUPABASE_URL y SUPABASE_KEY son necesariamente públicas: el cliente de
  # Supabase las usa en el navegador (la seguridad real la da RLS, no ocultar
  # la URL). El escaneo de secretos las marca igual porque quedan en el
  # bundle. Antes se excluía solo el chunk de Nitro donde aparecían
  # (SECRETS_SCAN_OMIT_PATHS), pero Nitro reparte el código en chunks con
  # nombres que cambian de build a build — cada vez que el grafo de server/
  # cambia, el valor puede terminar en un chunk nuevo no cubierto por esa
  # ruta fija y el deploy vuelve a fallar. Excluir por NOMBRE de variable es
  # estable sin importar en qué archivo termine.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_KEY"

# Las Scheduled Functions del proyecto:
#
#   netlify/functions/cron-healup-agendamientos.mts
#     → corre todos los días a las 00:00 UTC (= 19:00 Lima)
#     → dispara el endpoint del dashboard /api/healup/cron-agendamientos-diarios
#
#   netlify/functions/cron-healup-citas-manana.mts
#     → corre todos los días a las 00:00 UTC (= 19:00 Lima)
#     → dispara el endpoint del dashboard /api/healup/cron-citas-manana
#       (resumen de las citas del día siguiente: dashboard + Google Calendar)
#
#   netlify/functions/cron-davila-pre-reservas.mts
#     → corre cada 15 minutos (*/15 * * * *)
#     → dispara /api/davila/pre-reserva-cron
#       (marca como expiradas las pre-reservas sin pagar tras 40 min y libera el horario en GCal)
#
# El schedule está declarado dentro de cada archivo .mts con `export const config = { schedule: '...' }`.
